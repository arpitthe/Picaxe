version: '3.8'

# Root Compose file referencing infrastructure services
services:
  postgres:
    image: postgres:15
    container_name: picaxe-postgres
    environment:
      POSTGRES_USER: picaxe
      POSTGRES_PASSWORD: password
      POSTGRES_DB: picaxe
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: picaxe-redis
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant
    container_name: picaxe-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
